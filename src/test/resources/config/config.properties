# ============================================
# Practo Automation - Configuration File
# ============================================

# Base URL
base.url=https://www.practo.com

# Browser: chrome, edge, or firefox
browser=chrome

# Waits (in seconds)
implicit.wait=10
explicit.wait=15
page.load.timeout=30

# Screenshot folder
screenshot.path=screenshots/

# Report folder
report.path=reports/

# ===== Driver Paths (local executables in src/test/resources/drivers/) =====
chrome.driver.path=src/test/resources/drivers/chromedriver.exe
edge.driver.path=src/test/resources/drivers/msedgedriver.exe
firefox.driver.path=src/test/resources/drivers/geckodriver.exe